# Workflow temporal: genera package-lock.json en el primer push y luego se elimina.
name: Generar package-lock.json

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar y subir package-lock.json
        run: |
          if [ -f package-lock.json ]; then echo "Ya existe"; exit 0; fi
          npm install --package-lock-only --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Añadir package-lock.json"
          git push
